# SonarCloud 项目配置
sonar.projectKey=day10-react-todolist-starter
sonar.organization=your-organization-key
sonar.projectName=React TodoList Starter
sonar.projectVersion=1.0

# 源代码目录
sonar.sources=src
sonar.sourceEncoding=UTF-8

# 排除不需要分析的文件
sonar.exclusions=**/node_modules/**,**/coverage/**,**/build/**,**/dist/**,**/*.test.js,**/*.spec.js

# JavaScript/TypeScript 配置
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# 测试覆盖率报告路径
sonar.coverage.exclusions=**/node_modules/**,**/coverage/**,**/build/**,**/dist/**,**/*.test.js,**/*.spec.js
